name: Build FDU Connect

on:
  push:
    branches: [main, "build/campus-client-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdu-connect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64 GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.21.0

      - name: Test core
        run: go test ./...

      - name: Build and test GUI package
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          $version = if ($env:BUILD_REF.StartsWith('refs/tags/')) { $env:BUILD_TAG } else { 'dev' }
          .\build.ps1 -Test -Package -Version $version -OutputDirectory release
          Get-ChildItem -LiteralPath release -Filter '*.zip' -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM

      - uses: actions/upload-artifact@v7
        with:
          name: fdu-connect-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }} GUI
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, artifact: fdu-connect-linux-x64 }
          - { name: macOS universal, os: macos-latest, artifact: fdu-connect-macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.21.0

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Test core
        run: go test ./...

      - name: Build and test GUI package
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          version=dev
          if [[ "$BUILD_REF" == refs/tags/* ]]; then version="$BUILD_TAG"; fi
          bash build.sh --test --package --version "$version" --output release
          cd release
          for file in FDU-Connect-*; do
            case "$file" in *.zip|*.tar.gz) shasum -a 256 "$file" ;; esac
          done > "SHA256SUMS-${{ matrix.artifact }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/FDU-Connect-*.zip
            release/FDU-Connect-*.tar.gz
            release/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'exdoubled/FDU-Bridge'
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fdu-connect-*
          merge-multiple: true
          path: release

      - name: Verify package checksums
        working-directory: release
        run: |
          cat SHA256SUMS-*.txt >> SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish this repository's release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body > release-notes.md

          cat >> release-notes.md <<'EOF'

          ## 使用说明

          桌面 GUI（Windows x64、macOS 通用版、Linux x64）：为现有 Clash 一键添加复旦内网，支持 UIS 登录、托盘、诊断、外网节点和逐条校内资源开关。

          - Windows：解压 ZIP，运行 FDU-Connect-GUI.exe；核心须与 GUI 保持在同一目录。需要 Microsoft Edge WebView2 Runtime。
          - macOS：解压后将 FDU Connect.app 拖入“应用程序”，首次在 Finder 中右键选择“打开”（应用未经公证）。支持 Apple 芯片和 Intel。
          - Linux：解压 tar.gz，运行 fdu-connect-gui；需要 GTK 4 与 WebKitGTK 6.0（Ubuntu 24.04 起自带）。

          使用自己的复旦 UIS 账号登录。

          在首页启用校内访问，首次确认后自动备份并接入。保留 Clash 当前全局或规则模式，指定资源走 FDU，其他流量沿用外网设置。停用时先恢复出口再关闭 VPN。不开 TUN 时，仅覆盖进入 Clash 的应用流量，保留系统代理绕过列表。

          包内仅含 GUI、核心、公共示例配置和许可证，不含个人配置或登录缓存。SHA256SUMS.txt 可用于校验下载文件。

          感谢 [AkiraSalvare/fdu-connect](https://github.com/AkiraSalvare/fdu-connect)、[Mythologyli/zju-connect](https://github.com/Mythologyli/zju-connect)、[lyc8503/EasierConnect](https://github.com/lyc8503/EasierConnect) 及所有贡献者。
          EOF

          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$is_draft" == "false" ]]; then
            echo "::error::This release is already published; refusing to replace its assets."
            exit 1
          fi
          if [[ "$is_draft" != "true" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "FDU Connect $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.tar.gz release/SHA256SUMS.txt --clobber
          prerelease=false
          latest=true
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
            latest=false
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md \
            --draft=false --prerelease="$prerelease" --latest="$latest"
